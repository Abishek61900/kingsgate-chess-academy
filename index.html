  <!-- Tailwind CSS -->

<body class="bg-white text-slate-800 antialiased selection:bg-amber-100 selection:text-amber-900">
  <div id="root"></div>

      const [isSubmitted, setIsSubmitted] = useState(false);

        },
        {
          q: "Why do you cap cohorts at 6 students?",
          a: "Most online academies place 15-20 students in a single zoom room, turning coaching into passive lectures. In our 1:6 environment, the coach analyzes every single move played by every student on every board."
        },
        {
          q: "How does the Free Assessment Session work?",
          a: "It's a comprehensive 40-minute diagnostic session with our head coach. We evaluate board vision, tactical instinct, and calculation depth before sharing a custom 6-month roadmap."

                    </ul>
                  </div>
                  <button 
                    onClick={() => setIsModalOpen(true)}
                    class="mt-8 w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl text-sm transition-colors shadow-sm"
                  >
                    Select Intermediate
                  </button>
                </div>

                    <h4 class="text-2xl font-bold text-slate-900">Tournament Master</h4>

                    </ul>
                  </div>
                  <button 
                    onClick={() => setIsModalOpen(true)}
                    class="mt-8 w-full bg-slate-100 hover:bg-slate-200 text-slate-900 font-bold py-3 rounded-xl text-sm transition-colors"
                  >
                    Select Advanced
                  </button>
                </div>
              </div>
            </div>
          </section>

          {/* Founding Member Callout */}
          <section id="founding" class="py-16 bg-slate-950 text-white">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-bold tracking-wide uppercase mb-6">

                        </div>
                      </div>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Current Skill Level</label>
                          <select class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm bg-white">
                            <option>Absolute Beginner (Knows few rules)</option>
                            <option>Beginner (Can finish games)</option>
                            <option>Intermediate (Plays online rated)</option>
                            <option>Tournament Player (Has FIDE / Chess.com Elo)</option>
                          </select>
                        </div>
                        <div>
                          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Preferred Mode</label>
                          <select class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm bg-white">
                            <option>Online (Live Interactive)</option>
                            <option>Offline / Academy Studio</option>
                          </select>
                        </div>
                      </div>

                      <button 
                        type="submit" 
                        class="w-full mt-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-md transition-all text-sm"
                      >
                        Confirm Assessment Booking
                      </button>
                    </form>
                  </div>
                ) : (
                  <div class="text-center py-6">
                    <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4">
                      <i data-lucide="check" class="w-8 h-8 stroke-[3]"></i>
                    </div>
                    <h3 class="text-2xl font-black text-slate-900">Assessment Request Received!</h3>
                    <p class="text-slate-600 text-sm mt-2 max-w-sm mx-auto">
                      Thank you for contacting <strong>Kingsgate Chess Academy</strong>. Our head coach will connect via WhatsApp within 4 hours to confirm your scheduled time slot.
                    </p>
                    <button 
                      onClick={resetModal}
                      class="mt-6 bg-slate-900 text-white font-bold text-sm px-6 py-2.5 rounded-xl hover:bg-slate-800 transition-colors"
                    >
                      Done
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
